name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sprawdź wersję w manifest.json
        run: |
          VER=$(jq -r .version custom_components/openwrt_wifi/manifest.json)
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json ma wersję $VER, a tag to $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Spakuj integrację
        run: |
          cd custom_components/openwrt_wifi
          zip -r "$GITHUB_WORKSPACE/openwrt_wifi.zip" . -x '__pycache__/*' '*.pyc'

      - name: Opublikuj release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" openwrt_wifi.zip \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
